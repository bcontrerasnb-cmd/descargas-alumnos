<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Blog Personal - 7° Básico</title>
    <!-- Tipografía editorial de belleza y lujo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- BLOQUE CSS (DISEÑO MAQUILLAJE DE LUJO: BURDEO OSCURO, NEGRO, BLANCO, ROSADO Y DORADO) -->
    <style id="estilos-ia">
        /* =========================================
           VARIABLES Y RESET GLOBAL
           ========================================= */
        :root {
            --burdeo-oscuro: #3d0c19;        /* Burdeo oscuro profundo */
            --burdeo-hover: #280710;         /* Burdeo aún más oscuro */
            --negro: #0f0d0e;                /* Negro elegante */
            --blanco: #ffffff;               /* Blanco puro */
            --rosado: #f4c2d0;               /* Rosado suave de lujo */
            --rosado-intenso: #d97b96;       /* Rosado acento */
            --dorado: #d4af37;               /* Dorado clásico de lujo */
            --dorado-claro: #f5e6b3;         /* Dorado champagne suave */
            --color-fondo: #14090d;          /* Fondo negro-burdeo sofisticado */
            --color-superficie: var(--blanco);
            --color-texto: var(--negro);
            --color-texto-suave: #4a3f43;
            --color-primario: var(--burdeo-oscuro);
            --color-primario-hover: var(--burdeo-hover);
            --color-secundario: var(--dorado);
            --color-peligro: #7a1428;
            --color-exito: #1f5c4d;
            --borde-dorado: 1px solid var(--dorado);
            --borde-rosado: 1px solid var(--rosado);
            --borde-suave: 12px;
            --sombra: 0 12px 30px rgba(0, 0, 0, 0.35);
            --sombra-dorada: 0 10px 28px rgba(212, 175, 55, 0.16);
            --fuente-titulo: 'Cormorant Garamond', Georgia, serif;
            --fuente-cuerpo: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Fondo con puntos blancos rodeados por borde burdeo oscuro */
        body {
            background-color: var(--color-fondo);
            background-image:
                radial-gradient(circle, var(--blanco) 0 4px, var(--burdeo-oscuro) 4px 6.5px, transparent 6.8px),
                radial-gradient(circle, var(--blanco) 0 4px, var(--burdeo-oscuro) 4px 6.5px, transparent 6.8px),
                radial-gradient(circle at top, rgba(61, 12, 25, 0.65) 0%, rgba(20, 9, 13, 0.92) 60%, var(--negro) 100%);
            background-size: 44px 44px, 44px 44px, 100% 100%;
            background-position: 0 0, 22px 22px, 0 0;
            color: var(--blanco);
            font-family: var(--fuente-cuerpo);
            line-height: 1.65;
            min-height: 100vh;
        }

        /* Ocultamos las vistas secundarias por defecto */
        #vista-publicaciones, #vista-crear, #vista-editar {
            display: none;
        }

        /* =========================================
           BARRA DE NAVEGACIÓN (NAVBAR)
           ========================================= */
        .navbar {
            background-color: var(--negro);
            border-bottom: var(--borde-dorado);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 100;
        }

        .nav-lista {
            display: flex;
            justify-content: center;
            align-items: center;
            list-style: none;
            padding: 16px 20px;
            gap: 28px;
        }

        .nav-item {
            margin: 0 10px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--blanco);
            font-weight: 600;
            font-size: 0.92rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        .nav-link:hover {
            color: var(--rosado);
            border-bottom-color: var(--dorado);
        }

        /* =========================================
           CONTENEDOR PRINCIPAL Y VISTA INICIO
           ========================================= */
        .contenedor-principal {
            max-width: 820px;
            margin: 42px auto;
            padding: 0 20px;
        }

        .vista-seccion {
            animation: aparecer 0.5s ease-in-out;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #vista-inicio {
            text-align: center;
            background: var(--blanco);
            color: var(--negro);
            padding: 48px 36px;
            border-radius: var(--borde-suave);
            border: var(--borde-dorado);
            box-shadow: var(--sombra), var(--sombra-dorada);
            position: relative;
            overflow: hidden;
        }

        #vista-inicio::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--burdeo-oscuro), var(--dorado), var(--rosado-intenso), var(--dorado), var(--burdeo-oscuro));
        }

        .titulo-principal {
            font-family: var(--fuente-titulo);
            color: var(--burdeo-oscuro);
            margin-bottom: 24px;
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        /* Marco doble en dorado y rosado para la foto de perfil */
        .foto-perfil {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--dorado);
            outline: 3px solid var(--rosado);
            outline-offset: 4px;
            background-color: var(--blanco);
            margin-top: 6px;
            margin-bottom: 26px;
            box-shadow: 0 12px 26px rgba(61, 12, 25, 0.22), 0 0 0 8px rgba(244, 194, 208, 0.25);
            transition: transform 0.35s ease, outline-color 0.35s ease, border-color 0.35s ease;
        }

        .foto-perfil:hover {
            transform: scale(1.04);
            border-color: var(--rosado-intenso);
            outline-color: var(--dorado);
        }

        .texto-bienvenida {
            font-size: 1.1rem;
            color: var(--color-texto-suave);
            max-width: 580px;
            margin: 0 auto;
        }

        /* =========================================
           FORMULARIOS (TARJETAS DE CREAR/EDITAR)
           ========================================= */
        .tarjeta-formulario {
            background: var(--blanco);
            color: var(--negro);
            padding: 34px 30px;
            border-radius: var(--borde-suave);
            border: var(--borde-dorado);
            box-shadow: var(--sombra), var(--sombra-dorada);
            margin-bottom: 40px;
        }

        .subtitulo {
            font-family: var(--fuente-titulo);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 22px;
            color: var(--burdeo-oscuro);
            border-bottom: 2px solid var(--rosado);
            padding-bottom: 10px;
        }

        .etiqueta-pequena {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--burdeo-oscuro);
            margin-top: 15px;
            margin-bottom: 6px;
        }

        .input-formulario,
        .textarea-formulario {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 15px;
            background-color: var(--blanco);
            color: var(--negro);
            border: 1.5px solid var(--rosado);
            border-radius: 8px;
            font-family: var(--fuente-cuerpo);
            font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .input-formulario:focus,
        .textarea-formulario:focus {
            outline: none;
            border-color: var(--dorado);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.25);
        }

        .textarea-formulario {
            resize: vertical;
            min-height: 125px;
        }

        /* =========================================
           BOTONES
           ========================================= */
        .btn {
            padding: 11px 22px;
            border: 1px solid transparent;
            border-radius: 8px;
            font-family: var(--fuente-cuerpo);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--blanco);
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.12s ease, box-shadow 0.25s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primario {
            background-color: var(--burdeo-oscuro);
            border-color: var(--dorado);
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 6px 16px rgba(61, 12, 25, 0.35);
        }

        .btn-primario:hover {
            background-color: var(--burdeo-hover);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.28);
        }

        .btn-secundario {
            background-color: var(--dorado);
            color: var(--negro);
            margin-right: 10px;
        }

        .btn-secundario:hover {
            background-color: var(--dorado-claro);
        }

        .btn-peligro {
            background-color: var(--negro);
            border-color: var(--dorado);
            color: var(--rosado);
        }

        .btn-peligro:hover {
            background-color: var(--color-peligro);
            color: var(--blanco);
        }

        .btn-exito {
            background-color: var(--burdeo-oscuro);
            border-color: var(--dorado);
            color: var(--dorado-claro);
            margin-right: 10px;
            margin-top: 10px;
        }

        .btn-exito:hover {
            background-color: var(--burdeo-hover);
            color: var(--blanco);
        }

        /* =========================================
           MURO Y PUBLICACIONES (POSTS)
           ========================================= */
        .contenedor-muro {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .tarjeta-post {
            background: var(--blanco);
            color: var(--negro);
            border-radius: var(--borde-suave);
            border: var(--borde-dorado);
            box-shadow: var(--sombra), var(--sombra-dorada);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .tarjeta-post:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.45), 0 0 0 1px var(--rosado);
        }

        .t-post {
            padding: 22px 24px 12px 24px;
            font-family: var(--fuente-titulo);
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--burdeo-oscuro);
        }

        .img-post {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            display: block;
            border-top: 2px solid var(--dorado);
            border-bottom: 2px solid var(--rosado);
        }

        .img-post[src=""], .img-post:not([src]) {
            display: none;
        }

        .p-post {
            padding: 18px 24px;
            color: var(--color-texto-suave);
            white-space: pre-wrap;
        }

        .caja-botones {
            padding: 16px 24px 22px 24px;
            border-top: 1px solid var(--rosado);
            background-color: var(--negro);
        }

        /* =========================================
           RESPONSIVE (PARA CELULARES)
           ========================================= */
        @media (max-width: 600px) {
            .nav-lista {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }
            .nav-item {
                margin: 8px 0;
            }
            .titulo-principal {
                font-size: 2.1rem;
            }
            .caja-botones {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .btn-secundario, .btn-peligro {
                width: 100%;
                margin-right: 0;
            }
        }
    </style>
</head>
<body>

    <!-- BLOQUE HTML (ESTRUCTURA Y VISTAS) -->
    <nav class="navbar">
        <ul class="nav-lista">
            <li class="nav-item"><a href="#" class="nav-link" onclick="cambiarVista('vista-inicio')">Inicio</a></li>
            <li class="nav-item"><a href="#" class="nav-link" onclick="cambiarVista('vista-publicaciones')">Publicaciones</a></li>
        </ul>
    </nav>

    <main class="contenedor-principal">
        <section id="vista-inicio" class="vista-seccion vista-activa">
            <h1 class="titulo-principal">Bienvenido a mi Blog de Maquillaje</h1>
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/User_icon_2.svg/1024px-User_icon_2.svg.png" class="foto-perfil" alt="Mi Foto">
            <p class="texto-bienvenida">¡Hola! Mi nombre es Julieta Retamal del 7mo A y este es mi blog de maquillaje de lujo</p>
        </section>

        <section id="vista-publicaciones" class="vista-seccion">
            <button class="btn btn-primario" onclick="cambiarVista('vista-crear')" style="margin-bottom: 20px;">+ Crear Nueva Publicación</button>
            <div id="muro" class="contenedor-muro"></div>
        </section>

        <section id="vista-crear" class="vista-seccion">
            <div class="tarjeta-formulario">
                <h2 class="subtitulo">Nueva Publicación</h2>
                <input type="text" id="tit" class="input-formulario" placeholder="Título (máx 50 caracteres)" maxlength="50">
                <p class="etiqueta-pequena">Imagen (Sube un archivo o pega un link):</p>
                <input type="file" id="imgArchivo" class="input-formulario" accept="image/*">
                <input type="text" id="imgUrl" class="input-formulario" placeholder="O pega la URL aquí">
                <textarea id="txt" class="textarea-formulario" placeholder="¿Qué estás pensando?"></textarea>
                <button class="btn btn-primario" onclick="crearPost()">Publicar</button>
                <button class="btn btn-peligro" onclick="cambiarVista('vista-publicaciones')" style="margin-top: 10px;">Cancelar</button>
            </div>
        </section>

        <section id="vista-editar" class="vista-seccion">
            <div class="tarjeta-formulario">
                <h2 class="subtitulo">Editar Publicación</h2>
                <input type="text" id="edit-tit" class="input-formulario" maxlength="50">
                <p class="etiqueta-pequena">Cambiar imagen (déjalo en blanco para mantener la actual):</p>
                <input type="file" id="edit-imgArchivo" class="input-formulario" accept="image/*">
                <input type="text" id="edit-imgUrl" class="input-formulario" placeholder="O nueva URL de imagen">
                <input type="hidden" id="edit-imgActual">
                <textarea id="edit-txt" class="textarea-formulario"></textarea>
                <button class="btn btn-exito" onclick="guardarEdicion()">Guardar Cambios</button>
                <button class="btn btn-peligro" onclick="cambiarVista('vista-publicaciones')" style="margin-top: 10px;">Cancelar</button>
            </div>
        </section>
    </main>

    <!-- BLOQUE JAVASCRIPT (LÓGICA Y CRUD 7° Básico) -->
    <script>
        function cambiarVista(idVistaDestino) {
            document.getElementById('vista-inicio').style.display = 'none';
            document.getElementById('vista-publicaciones').style.display = 'none';
            document.getElementById('vista-crear').style.display = 'none';
            document.getElementById('vista-editar').style.display = 'none';

            document.getElementById(idVistaDestino).style.display = 'block';
        }

        function obtenerImagen(idArchivo, idUrl, idActual = null) {
            let archivo = document.getElementById(idArchivo).files[0];
            let url = document.getElementById(idUrl).value;

            if (archivo) {
                return URL.createObjectURL(archivo);
            } else if (url !== "") {
                return url;
            } else if (idActual) {
                return document.getElementById(idActual).value;
            }
            return "";
        }

        function crearPost() {
            let titulo = document.getElementById("tit").value;
            let texto = document.getElementById("txt").value;
            let imagenFinal = obtenerImagen("imgArchivo", "imgUrl");

            if(titulo === "" && texto === "") {
                alert("¡Debes escribir un título o texto antes de publicar!");
                return;
            }

            document.getElementById("muro").innerHTML += `
                <div class="tarjeta-post">
                    <h3 class="t-post">${titulo}</h3>
                    <img src="${imagenFinal}" class="img-post">
                    <p class="p-post">${texto}</p>
                    <div class="caja-botones">
                        <button class="btn btn-secundario" onclick="abrirEditar(this)">Editar</button>
                        <button class="btn btn-peligro" onclick="borrarPost(this)">Eliminar</button>
                    </div>
                </div>
            `;

            document.getElementById("tit").value = "";
            document.getElementById("txt").value = "";
            document.getElementById("imgUrl").value = "";
            document.getElementById("imgArchivo").value = "";

            cambiarVista('vista-publicaciones');
        }

        function borrarPost(botonApretado) {
            let confirmacion = confirm("¿Seguro que quieres eliminar esta publicación?");

            if (confirmacion === true) {
                botonApretado.parentElement.parentElement.remove();
            }
        }

        let postAEditar = null;

        function abrirEditar(botonApretado) {
            postAEditar = botonApretado.parentElement.parentElement;

            document.getElementById("edit-tit").value = postAEditar.querySelector('.t-post').innerText;
            document.getElementById("edit-txt").value = postAEditar.querySelector('.p-post').innerText;
            document.getElementById("edit-imgActual").value = postAEditar.querySelector('.img-post').src;

            document.getElementById("edit-imgArchivo").value = "";
            document.getElementById("edit-imgUrl").value = "";

            cambiarVista('vista-editar');
        }

        function guardarEdicion() {
            let nuevoTit = document.getElementById("edit-tit").value;
            let nuevoTxt = document.getElementById("edit-txt").value;
            let nuevaImg = obtenerImagen("edit-imgArchivo", "edit-imgUrl", "edit-imgActual");

            postAEditar.querySelector('.t-post').innerText = nuevoTit;
            postAEditar.querySelector('.p-post').innerText = nuevoTxt;
            postAEditar.querySelector('.img-post').src = nuevaImg;

            cambiarVista('vista-publicaciones');
        }
    </script>
</body>
</html>
