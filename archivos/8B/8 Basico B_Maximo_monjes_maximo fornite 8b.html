<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Blog - Crónicas de la Isla</title>
    
    <!-- BLOQUE CSS (DISEÑO ESTILO FORTNITE) -->
    <style id="estilos-ia">
        @import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Roboto:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: radial-gradient(circle at top, #1b3b82 0%, #0b1633 60%, #050a18 100%);
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* BARRA DE NAVEGACIÓN SUPERIOR */
        header {
            background: rgba(11, 22, 51, 0.9);
            border-bottom: 3px solid #00d2ff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        .logo-fortnite {
            font-family: 'Luckiest Guy', cursive;
            font-size: 2rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 3px 3px 0px #0077ff, -1px -1px 0 #000;
            cursor: pointer;
        }

        nav {
            display: flex;
            gap: 10px;
        }

        /* BOTONES ESTILO LOBBY */
        .btn {
            font-family: 'Roboto', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            letter-spacing: 1px;
            transition: transform 0.15s ease, filter 0.15s ease;
            clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%);
        }

        .btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        .btn-amarillo {
            background: linear-gradient(180deg, #ffe600 0%, #ffaa00 100%);
            color: #0b1633;
            box-shadow: 0 4px 0 #b37700;
        }

        .btn-azul {
            background: linear-gradient(180deg, #00d2ff 0%, #0077ff 100%);
            color: #ffffff;
            box-shadow: 0 4px 0 #004499;
        }

        .btn-secundario {
            background: #2c4c96;
            color: #ffffff;
            border: 1px solid #00d2ff;
        }

        .btn-peligro {
            background: linear-gradient(180deg, #ff4b4b 0%, #c70039 100%);
            color: #ffffff;
        }

        /* CONTENEDOR PRINCIPAL */
        .contenedor {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* CONTROL DE PANTALLAS (NO BORRAR) */
        #vista-publicaciones, #vista-crear, #vista-editar { 
            display: none; 
        }

        /* PANTALLA INICIO (LOBBY) */
        .banner-lobby {
            background: linear-gradient(135deg, rgba(24, 58, 138, 0.85), rgba(11, 22, 51, 0.95));
            border: 2px solid #00d2ff;
            border-radius: 10px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .banner-lobby h1 {
            font-family: 'Luckiest Guy', cursive;
            font-size: 3rem;
            color: #ffe600;
            text-shadow: 3px 3px 0 #000;
            margin-bottom: 15px;
        }

        .banner-lobby p {
            font-size: 1.15rem;
            color: #cce0ff;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* FORMULARIOS (CREAR Y EDITAR) */
        .caja-formulario {
            background: rgba(15, 32, 74, 0.95);
            border: 2px solid #3a66cc;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .caja-formulario h2 {
            font-family: 'Luckiest Guy', cursive;
            font-size: 2rem;
            color: #00d2ff;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .grupo-input {
            margin-bottom: 15px;
        }

        .grupo-input label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffe600;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: 2px solid #2c4c96;
            background: #081126;
            color: #ffffff;
            font-family: 'Roboto', sans-serif;
            font-size: 1rem;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #00d2ff;
        }

        /* MURO DE PUBLICACIONES (TAQUILLA / PARTIDAS) */
        .titulo-seccion {
            font-family: 'Luckiest Guy', cursive;
            font-size: 2.2rem;
            color: #ffe600;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #000;
        }

        #muro {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .tarjeta-post {
            background: linear-gradient(180deg, #1d4299 0%, #0d1d47 100%);
            border: 3px solid #00d2ff;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s;
        }

        .tarjeta-post:hover {
            transform: translateY(-5px);
            border-color: #ffe600;
        }

        .t-post {
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 15px;
            font-family: 'Luckiest Guy', cursive;
            font-size: 1.4rem;
            color: #ffe600;
            letter-spacing: 1px;
        }

        .img-post {
            width: 100%;
            height: 190px;
            object-fit: cover;
            background: #050a18;
            display: block;
        }

        /* Oculta la etiqueta img si no tiene foto cargada */
        .img-post[src=""] {
            display: none;
        }

        .p-post {
            padding: 15px;
            color: #e6f0ff;
            line-height: 1.5;
            flex-grow: 1;
            white-space: pre-wrap;
        }

        .caja-botones {
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>

    <!-- ENCABEZADO / MENÚ -->
    <header>
        <div class="logo-fortnite" onclick="cambiarVista('vista-inicio')">FORTNITE BLOG</div>
        <nav>
            <button class="btn btn-azul" onclick="cambiarVista('vista-inicio')">Lobby</button>
            <button class="btn btn-azul" onclick="cambiarVista('vista-publicaciones')">Muro de Partidas</button>
            <button class="btn btn-amarillo" onclick="cambiarVista('vista-crear')">+ Nueva Crónica</button>
        </nav>
    </header>

    <!-- BLOQUE HTML PRINCIPAL -->
    <main class="contenedor">

        <!-- PANTALLA 1: INICIO (LOBBY) -->
        <section id="vista-inicio">
            <div class="banner-lobby">
                <h1>¡BIENVENIDO AL AUTOBÚS DE BATALLA!</h1>
                <p>Comparte tus mejores <strong>Victory Royales</strong>, tus skins favoritas de la tienda, estrategias para sobrevivir a la tormenta o los lugares más épicos para caer en el mapa.</p>
                <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                    <button class="btn btn-amarillo" onclick="cambiarVista('vista-crear')">¡Publicar Victoria!</button>
                    <button class="btn btn-azul" onclick="cambiarVista('vista-publicaciones')">Ver Publicaciones</button>
                </div>
            </div>
        </section>

        <!-- PANTALLA 2: MURO DE PUBLICACIONES -->
        <section id="vista-publicaciones">
            <h2 class="titulo-seccion">Muro de la Isla</h2>
            <div id="muro">
                <!-- Aquí JavaScript dibujará las tarjetas automáticamente -->
            </div>
        </section>

        <!-- PANTALLA 3: CREAR PUBLICACIÓN -->
        <section id="vista-crear">
            <div class="caja-formulario">
                <h2>Nueva Publicación de Partida</h2>
                
                <div class="grupo-input">
                    <label for="tit">Título (Ej: ¡Victory Royale con 12 eliminaciones!):</label>
                    <input type="text" id="tit" placeholder="Escribe un título épico...">
                </div>

                <div class="grupo-input">
                    <label for="txt">Historia o Estrategia:</label>
                    <textarea id="txt" rows="4" placeholder="Cuenta dónde caíste, qué armas usaste o qué pasó en el último círculo..."></textarea>
                </div>

                <div class="grupo-input">
                    <label for="imgArchivo">Subir captura desde tu PC:</label>
                    <input type="file" id="imgArchivo" accept="image/*">
                </div>

                <div class="grupo-input">
                    <label for="imgUrl">O pega un enlace (URL) de una skin o mapa:</label>
                    <input type="text" id="imgUrl" placeholder="https://ejemplo.com/imagen-fortnite.jpg">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button class="btn btn-amarillo" onclick="crearPost()">Publicar en el Muro</button>
                    <button class="btn btn-secundario" onclick="cambiarVista('vista-publicaciones')">Cancelar</button>
                </div>
            </div>
        </section>

        <!-- PANTALLA 4: EDITAR PUBLICACIÓN -->
        <section id="vista-editar">
            <div class="caja-formulario">
                <h2>Editar Publicación</h2>
                
                <!-- Caja invisible para recordar la foto anterior si el usuario no sube una nueva -->
                <input type="hidden" id="edit-imgActual">

                <div class="grupo-input">
                    <label for="edit-tit">Título:</label>
                    <input type="text" id="edit-tit">
                </div>

                <div class="grupo-input">
                    <label for="edit-txt">Historia o Estrategia:</label>
                    <textarea id="edit-txt" rows="4"></textarea>
                </div>

                <div class="grupo-input">
                    <label for="edit-imgArchivo">Cambiar foto desde tu PC (opcional):</label>
                    <input type="file" id="edit-imgArchivo" accept="image/*">
                </div>

                <div class="grupo-input">
                    <label for="edit-imgUrl">O cambiar por nuevo enlace URL (opcional):</label>
                    <input type="text" id="edit-imgUrl" placeholder="Dejar vacío para mantener la imagen actual">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button class="btn btn-amarillo" onclick="guardarEdicion()">Guardar Cambios</button>
                    <button class="btn btn-secundario" onclick="cambiarVista('vista-publicaciones')">Cancelar</button>
                </div>
            </div>
        </section>

    </main>

    <!-- (EL CEREBRO DEL BLOG VERSIÓN) -->
    <script>
        // ==========================================
        // 1. LA LISTA DE COMPRAS (El Arreglo)
        // ==========================================
        
        // Guardamos toda la información en una Lista ordenadita (Arreglo). 
        // Agregamos una publicación inicial temática de Fortnite para que el muro no se vea vacío al abrirlo.
        let miListaDePublicaciones = [
            {
                titulo: "¡Primera Victoria Magistral de la Temporada!",
                imagen: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80",
                texto: "Caímos en Pisos Picados, conseguimos buen loot rápido y aguantamos hasta el último círculo de la tormenta. ¡Qué partida más intensa!"
            }
        ];
        
        // Esta es una memoria para recordar en qué "número de fila" de la lista está el post que queremos editar.
        let posicionEnLaLista = null;

        // ==========================================
        // 2. NAVEGACIÓN Y AYUDANTES
        // ==========================================
        
        // TAREA: CAMBIAR ENTRE PANTALLAS
        function cambiarVista(pantallaDestino) {
            // Escondemos todas las pantallas (display: none).
            document.getElementById('vista-inicio').style.display = 'none';
            document.getElementById('vista-publicaciones').style.display = 'none';
            document.getElementById('vista-crear').style.display = 'none';
            document.getElementById('vista-editar').style.display = 'none';
            
            // Mostramos solo la pantalla elegida (display: block).
            document.getElementById(pantallaDestino).style.display = 'block';
        }

        // TAREA: PROCESAR LA IMAGEN
        function obtenerImagen(cajaArchivo, cajaLink, cajaFotoVieja = null) {
            let archivoDePC = document.getElementById(cajaArchivo).files[0];
            // .trim() es como una tijera que corta los espacios vacíos que el usuario puso por accidente al principio o al final.
            let linkDeInternet = document.getElementById(cajaLink).value.trim(); 
            
            if (archivoDePC) {
                return URL.createObjectURL(archivoDePC); 
            } else if (linkDeInternet !== "") {
                return linkDeInternet; 
            } else if (cajaFotoVieja) {
                return document.getElementById(cajaFotoVieja).value; 
            }
            return ""; 
        }

        // ==========================================
        // 3. DIBUJAR TODO EL MURO (La magia del Ciclo)
        // ==========================================
        function mostrarPosts() {
            let cajaMuro = document.getElementById("muro");
            
            // PASO CRÍTICO: ¡Borrador mágico! 
            // Borramos toda la pantalla para que no se nos dupliquen las cosas cuando el ciclo empiece a dibujar.
            cajaMuro.innerHTML = "";

            // LA MÁQUINA DE REPETICIÓN (Ciclo For)
            // Esto le dice al computador: "Empieza a contar en 0 (let i = 0). 
            // Repite esta tarea mientras no te pases de la cantidad de cosas que hay en nuestra lista (i < miListaDePublicaciones.length).
            // Y avanza de uno en uno (i++)".
            for (let i = 0; i < miListaDePublicaciones.length; i++) {
                
                // Sacamos la información pura del objeto que está en la fila 'i'.
                let postActual = miListaDePublicaciones[i];

                // Y ahora, le sumamos (+=) a la pantalla el diseño HTML, rellenándolo con la info pura.
                // Fíjate en los botones: Ahora enviamos el número 'i'. Así los botones saben exactamente qué posición de la lista deben borrar o editar.
                cajaMuro.innerHTML += `
                    <div class="tarjeta-post">
                        <h3 class="t-post">${postActual.titulo}</h3>
                        <img src="${postActual.imagen}" class="img-post">
                        <p class="p-post">${postActual.texto}</p>
                        <div class="caja-botones">
                            <button class="btn btn-secundario" onclick="abrirEditar(${i})">Editar</button>
                            <button class="btn btn-peligro" onclick="borrarPost(${i})">Eliminar</button>
                        </div>
                    </div>
                `;
            }
        }

        // ==========================================
        // 4. CREAR NUEVA PUBLICACIÓN
        // ==========================================
        function crearPost() {
            // 1. Rescatamos los textos de las cajas y les cortamos los espacios extra (.trim).
            let tituloEscrito = document.getElementById("tit").value.trim();
            let textoEscrito = document.getElementById("txt").value.trim();
            let imagenFinal = obtenerImagen("imgArchivo", "imgUrl");

            // 2. Si escribieron puras cosas vacías, los frenamos.
            if (tituloEscrito === "" && textoEscrito === "") {
                alert("¡Debes escribir un título o un texto antes de publicar!");
                return;
            }

            // 3. EMPUJAMOS (.push) toda la información empaquetada como un "Objeto" hacia nuestra Lista principal.
            miListaDePublicaciones.push({
                titulo: tituloEscrito,
                imagen: imagenFinal,
                texto: textoEscrito
            });
            
            // 4. Limpiamos las cajas para que el formulario quede listo para el próximo uso.
            document.getElementById("tit").value = "";
            document.getElementById("txt").value = "";
            document.getElementById("imgUrl").value = "";
            document.getElementById("imgArchivo").value = "";

            // 5. Como nuestra Lista acaba de crecer, le ordenamos a nuestra Tarea 3 (mostrarPosts) 
            // que vuelva a encender su Ciclo For y dibuje la lista actualizada en pantalla.
            mostrarPosts();
            
            // 6. Cambiamos de pantalla para ir a ver nuestro muro.
            cambiarVista('vista-publicaciones'); 
        }

        // ==========================================
        // 5. ELIMINAR UNA PUBLICACIÓN
        // ==========================================
        // Esta función recibe un número ('numeroEnLaFila'), que es la posición que el ciclo For le puso al botón.
        function borrarPost(numeroEnLaFila) {
            let confirmacion = confirm("¿Seguro que quieres eliminar esta publicación?");
            
            if (confirmacion === true) {
                // Usamos el poder '.splice()'. Esto se mete directo a nuestra Lista en la memoria,
                // busca la posición exacta 'numeroEnLaFila', destruye '1' elemento, y empuja a los demás hacia arriba para no dejar un hueco.
                miListaDePublicaciones.splice(numeroEnLaFila, 1);
                
                // Como la Lista cambió (tiene una cosa menos), ordenamos al muro que se dibuje de nuevo para actualizarse.
                mostrarPosts();
            }
        }

        // ==========================================
        // 6. EDITAR PUBLICACIONES
        // ==========================================
        
        // Parte 1: Cargar la información. También recibe el número de la fila.
        function abrirEditar(numeroEnLaFila) {
            // 1. Anotamos en nuestro cuaderno global en qué número estamos para que no se nos olvide.
            posicionEnLaLista = numeroEnLaFila;
            
            // 2. Extraemos toda la información desde la memoria de la Lista.
            let postParaCorregir = miListaDePublicaciones[numeroEnLaFila];

            // 3. Rellenamos las cajas de edición con la información pura de la Lista (ya no leemos el HTML).
            document.getElementById("edit-tit").value = postParaCorregir.titulo;
            document.getElementById("edit-txt").value = postParaCorregir.texto;
            document.getElementById("edit-imgActual").value = postParaCorregir.imagen;
            
            // Vaciamos las cajas de imagen nueva.
            document.getElementById("edit-imgArchivo").value = "";
            document.getElementById("edit-imgUrl").value = "";
            
            // Mostramos la pantalla de editar.
            cambiarVista('vista-editar'); 
        }

        // Parte 2: Guardar las correcciones
        function guardarEdicion() {
            // 1. Rescatamos los nuevos textos corregidos.
            let nuevoTitulo = document.getElementById("edit-tit").value.trim();
            let nuevoTexto = document.getElementById("edit-txt").value.trim();
            let nuevaImagen = obtenerImagen("edit-imgArchivo", "edit-imgUrl", "edit-imgActual");
            
            // 2. ¡Sobreescribimos la memoria! Vamos a nuestra Lista, ubicamos la posición exacta
            // que teníamos anotada, y le chancamos la información vieja con la información nueva.
            miListaDePublicaciones[posicionEnLaLista].titulo = nuevoTitulo;
            miListaDePublicaciones[posicionEnLaLista].texto = nuevoTexto;
            miListaDePublicaciones[posicionEnLaLista].imagen = nuevaImagen;
            
            // 3. Como modificamos algo de la Lista, volvemos a dibujar el muro y cambiamos de pantalla.
            mostrarPosts();
            cambiarVista('vista-publicaciones');
        }

        // Dibujamos el muro al cargar la página para mostrar el post de ejemplo
        mostrarPosts();
    </script>
</body>
</html>
