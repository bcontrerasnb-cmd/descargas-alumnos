<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Descarga de Trabajos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 750px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <h3 class="text-primary fw-bold mb-0">Portal de Descarga de Trabajos</h3>
                <span id="fechaActualizacion" class="badge bg-secondary-subtle text-secondary"></span>
            </div>
            <p class="text-muted mb-4">Selecciona tu curso, busca tu archivo y haz clic en descargar.</p>

            <!-- Filtros -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Curso</label>
                    <select id="selectCurso" class="form-select">
                        <option value="">-- Elige tu curso --</option>
                        <option value="5A">5° Básico A</option>
                        <option value="5B">5° Básico B</option>
                        <option value="7A">7° Básico A</option>
                        <option value="7B">7° Básico B</option>
                        <option value="8A">8° Básico A</option>
                        <option value="8B">8° Básico B</option>
                    </select>
                </div>
                <div class="col-md-8">
                    <label class="form-label fw-semibold">Buscar archivo o alumno</label>
                    <input type="text" id="inputBuscador" class="form-control" placeholder="Escribe tu nombre o el del archivo..." disabled>
                </div>
            </div>

            <!-- Lista de resultados -->
            <div id="listaArchivos" class="list-group">
                <div class="text-center text-muted py-4">
                    Selecciona un curso arriba para ver los archivos disponibles.
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const selectCurso = document.getElementById('selectCurso');
    const inputBuscador = document.getElementById('inputBuscador');
    const listaArchivos = document.getElementById('listaArchivos');
    const fechaActualizacion = document.getElementById('fechaActualizacion');

    let catalogo = {};

    // Carga el catálogo estático evitando la caché del navegador
    async function cargarCatalogo() {
        try {
            const respuesta = await fetch(`archivos.json?v=${Date.now()}`);
            if (!respuesta.ok) throw new Error("No se encontró archivos.json");
            const data = await respuesta.json();
            catalogo = data.cursos || {};
            if (data.actualizado) {
                fechaActualizacion.textContent = `Actualizado: ${data.actualizado}`;
            }
        } catch (error) {
            listaArchivos.innerHTML = `<div class="alert alert-warning mb-0">Aún no se ha generado el catálogo de archivos. Ejecuta <b>actualizar.bat</b> en tu computador.</div>`;
        }
    }

    function renderizarLista() {
        const curso = selectCurso.value;
        const filtro = inputBuscador.value.toLowerCase().trim();
        listaArchivos.innerHTML = '';

        if (!curso) {
            inputBuscador.disabled = true;
            inputBuscador.value = '';
            listaArchivos.innerHTML = '<div class="text-center text-muted py-4">Selecciona un curso arriba para ver los archivos disponibles.</div>';
            return;
        }

        inputBuscador.disabled = false;
        const archivos = catalogo[curso] || [];
        const filtrados = archivos.filter(nombre => nombre.toLowerCase().includes(filtro));

        if (filtrados.length === 0) {
            listaArchivos.innerHTML = '<div class="alert alert-warning mb-0">No se encontraron archivos con ese nombre en este curso.</div>';
            return;
        }

        filtrados.forEach(nombre => {
            const rutaDescarga = `archivos/${curso}/${encodeURIComponent(nombre)}`;
            const item = document.createElement('div');
            item.className = 'list-group-item d-flex justify-content-between align-items-center';
            item.innerHTML = `
                <span class="text-break me-3">📄 ${nombre}</span>
                <a href="${rutaDescarga}" download="${nombre}" class="btn btn-sm btn-success fw-semibold flex-shrink-0">
                    Descargar
                </a>
            `;
            listaArchivos.appendChild(item);
        });
    }

    selectCurso.addEventListener('change', renderizarLista);
    inputBuscador.addEventListener('input', renderizarLista);

    cargarCatalogo();
</script>

</body>
</html>
